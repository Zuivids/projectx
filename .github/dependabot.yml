# Opens weekly pull requests for outdated dependencies. CI tests each one before you merge.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for all Spring Boot managed updates instead of many small ones
      spring-boot:
        patterns:
          - "org.springframework.boot*"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      # Minor and patch updates in one PR; major versions get their own PR
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Types must match the Node.js version we run (24, see CI); raise this together with Node
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
