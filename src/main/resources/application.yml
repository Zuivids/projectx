spring:
  application:
    name: projectx
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/lms}
    username: ${DB_USERNAME:lms_app}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

app:
  name: ProjectX
  mfa:
    encryption-key: ${MFA_ENCRYPTION_KEY}
    pending-timeout: 5m
  lockout:
    max-failed-attempts-per-ip: 5
    max-failed-attempts: 20
    duration: 15m
  # Per client IP. Generous on purpose: a school or office shares one IP among many users.
  rate-limit:
    login:
      limit: 20
      window: 1m
    mfa:
      limit: 20
      window: 1m
    register:
      limit: 10
      window: 1h
  # After login. Before login (and during the MFA step) server.servlet.session.timeout applies.
  session:
    learner:
      idle: 30m
      absolute: 24h
    staff:
      idle: 15m
      absolute: 8h

server:
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: true
        same-site: strict

logging:
  level:
    # These two log the JDBC URL at startup, and the MariaDB driver includes the database
    # password in it. Warnings and errors are still logged.
    org.flywaydb.core.FlywayExecutor: WARN
    org.hibernate.orm.connections.pooling: WARN

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
