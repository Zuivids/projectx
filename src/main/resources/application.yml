spring:
  application:
    name: projectx
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/lms}
    username: ${DB_USERNAME:lms_app}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

app:
  name: ProjectX
  mfa:
    encryption-key: ${MFA_ENCRYPTION_KEY}
    pending-timeout: 5m
  lockout:
    max-failed-attempts: 5
    duration: 15m

server:
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: true
        same-site: strict

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
