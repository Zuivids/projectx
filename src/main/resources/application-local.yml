# Local development only. dev-start.bat / dev-start.sh activate it; never use it in staging or production.

app:
  mfa:
    # LOCAL-ONLY key. Production must set MFA_ENCRYPTION_KEY from a secret store.
    encryption-key: cN8TweTSrRzWyffTo6nVDh7Yxz8c6VvVswT6oHB3DQ8=

  # Super admin created automatically for local testing (values come from .env)
  local-seed:
    admin-email: ${LOCAL_ADMIN_EMAIL:}
    admin-password: ${LOCAL_ADMIN_PASSWORD:}

server:
  servlet:
    session:
      cookie:
        # Allows the session cookie over plain http://localhost
        secure: false
